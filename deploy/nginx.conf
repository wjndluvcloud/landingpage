server {
    # Cloudflare Tunnel chuyển domain nducvu.men tới cổng local này.
    listen 127.0.0.1:8081 default_server;
    server_name _;

    root /var/www/landingpage;
    index index.html;
    charset utf-8;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; object-src 'none'; img-src 'self' data:; style-src 'self'; script-src 'self'" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
